<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="description" content="Metro Dash - 3D Endless Runner" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <title>Metro Dash</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <canvas id="gameCanvas"></canvas>

    <!-- HUD Overlay -->
    <div id="hud" class="hidden">
      <div id="hud-top">
        <div id="score-display">
          <span class="hud-label">SCORE</span>
          <span id="score-value" class="hud-value">0</span>
        </div>
        <div id="coins-display">
          <span class="hud-label"><svg class="icon icon-coin" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M8 .5a7.5 7.5 0 1 1 0 15 7.5 7.5 0 0 1 0-15Zm0 2.7a4.8 4.8 0 1 0 0 9.6 4.8 4.8 0 0 0 0-9.6Z"/><circle cx="8" cy="8" r="2.6"/></svg></span>
          <span id="coins-value" class="hud-value">0</span>
        </div>
      </div>
      <div id="multiplier-display" class="hidden">
        <span class="hud-label">x<span id="multiplier-value">1</span></span>
      </div>
      <div id="combo-display" class="hidden">
        <span id="combo-value">0</span> COMBO!
      </div>
    </div>

    <!-- Menu Screen -->
    <div id="menu-screen">
      <div class="menu-container">
        <h1 class="game-title">
          <span class="title-sub">METRO</span>
          <span class="title-main">DASH</span>
        </h1>
        <div id="username-form">
          <input
            type="text"
            id="username-input"
            placeholder="Enter your name"
            maxlength="20"
            autocomplete="username"
          />
          <button id="play-btn" class="btn btn-primary">PLAY</button>
        </div>
        <div id="menu-stats" class="hidden">
          <div class="stat-row">
            <span><svg class="icon icon-trophy" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M6 2h12v7a6 6 0 0 1-12 0V2Z"/><path fill-rule="evenodd" d="M4 3.5a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm0 1.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Z"/><path fill-rule="evenodd" d="M20 3.5a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm0 1.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Z"/><rect x="10.4" y="14" width="3.2" height="5"/><rect x="6.5" y="18" width="11" height="3" rx="1"/></svg> High Score: <strong id="menu-high-score">0</strong></span>
          </div>
          <div class="stat-row">
            <span><svg class="icon icon-coin" viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M8 .5a7.5 7.5 0 1 1 0 15 7.5 7.5 0 0 1 0-15Zm0 2.7a4.8 4.8 0 1 0 0 9.6 4.8 4.8 0 0 0 0-9.6Z"/><circle cx="8" cy="8" r="2.6"/></svg> Coins: <strong id="menu-coins">0</strong></span>
          </div>
          <div class="stat-row">
            <span><svg class="icon icon-flag" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" focusable="false"><path d="M5 2h2v20H5V2Zm4 2h10l-3 4.5L19 13H9V4Z"/></svg> Runs: <strong id="menu-games">0</strong></span>
          </div>
        </div>
        <div class="controls-hint">
          <p>← → or A/D to switch lanes</p>
          <p>↑ or W or tap top to jump</p>
          <p>↓ or S or tap bottom to roll</p>
        </div>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="hidden">
      <div class="menu-container">
        <h2 class="gameover-title">GAME OVER</h2>
        <div class="gameover-stats">
          <div class="stat-card">
            <span class="stat-label">SCORE</span>
            <span class="stat-value" id="go-score">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">DISTANCE</span>
            <span class="stat-value" id="go-distance">0m</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">COINS</span>
            <span class="stat-value" id="go-coins">0</span>
          </div>
        </div>
        <div id="new-high-score" class="hidden">
          <span><svg class="icon icon-trophy" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M6 2h12v7a6 6 0 0 1-12 0V2Z"/><path fill-rule="evenodd" d="M4 3.5a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm0 1.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Z"/><path fill-rule="evenodd" d="M20 3.5a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm0 1.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Z"/><rect x="10.4" y="14" width="3.2" height="5"/><rect x="6.5" y="18" width="11" height="3" rx="1"/></svg> NEW HIGH SCORE!</span>
        </div>
        <div class="gameover-buttons">
          <button id="retry-btn" class="btn btn-primary">RETRY</button>
          <button id="menu-btn" class="btn btn-secondary">MENU</button>
        </div>
      </div>
    </div>

    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loader">
        <div class="spinner"></div>
        <p>Loading...</p>
      </div>
    </div>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
      }
    }
    </script>
    <script type="module" src="js/game.js"></script>
    <script src="js/pwa-register.js"></script>
  </body>
</html>
