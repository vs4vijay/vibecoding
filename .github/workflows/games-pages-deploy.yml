# Games — GitHub Pages deploy
#
# Builds every web game in this monorepo and publishes them together to
# GitHub Pages. ONE workflow owns the whole site on purpose: each Pages
# deployment replaces the previous site, so separate per-game workflows
# would clobber each other's URLs.
#
  # Layout on Pages:
  #   /                   <- games-hub/ landing page (static, no build)
  #   /tank-racer/        <- tank-racer/dist      (built with BASE_PATH)
  #   /undead-driver/     <- undead-driver/dist  (vite base "./", subpath-safe)
  #   /lugaru-combat/     <- lugaru-combat/dist  (vite base "./", subpath-safe)
  #   /dave-dangerous/    <- dave-dangerous/dist  (vite base "./", subpath-safe)
  #   /tiny-fighters/    <- tiny-fighters/dist  (vite base "./", subpath-safe)
  #   /claude-of-duty/    <- Claude-of-Duty/dist (vite base "./", subpath-safe)
  #   /asphalt-outlaws/   <- asphalt-outlaws/dist (vite base "./", subpath-safe)
  #   /vulture-pass/      <- vulture-pass/dist   (vite base "./", subpath-safe)
  #   /laser-snail/       <- laser-snail/dist    (vite base "./", subpath-safe)
  #   /neon-rush/         <- neon-rush/dist      (no bundler by design — build is a pure staging copy)
  #   /devils-highway/    <- devils-highway/     (no build — adopted game, copied verbatim)

name: Deploy Games to Pages

on:
  push:
    branches: [main]
    paths:
      - "tank-racer/**"
      - "undead-driver/**"
      - "lugaru-combat/**"
      - "dave-dangerous/**"
      - "tiny-fighters/**"
      - "Claude-of-Duty/**"
      - "asphalt-outlaws/**"
      - "vulture-pass/**"
      - "laser-snail/**"
      - "neon-rush/**"
      - "devils-highway/**"
      - "games-hub/**"
      - ".github/workflows/games-pages-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Build tank-racer
        working-directory: tank-racer
        env:
          # Must match the path Pages serves the site under.
          BASE_PATH: /${{ github.event.repository.name }}/tank-racer/
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build undead-driver
        working-directory: undead-driver
        # vite.config.ts sets base "./" so the build works under any subpath
        # (/vibecoding/undead-driver/) with no BASE_PATH env needed.
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Build lugaru-combat
        working-directory: lugaru-combat
        # vite.config.ts sets base "./" so the build works under any subpath
        # (/vibecoding/lugaru-combat/) with no BASE_PATH env needed.
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build dave-dangerous
        working-directory: dave-dangerous
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build tiny-fighters
        working-directory: tiny-fighters
        # vite.config.ts sets base "./" so the build works under any subpath
        # (/vibecoding/tiny-fighters/) with no BASE_PATH env needed.
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build claude-of-duty
        working-directory: Claude-of-Duty
        # vite.config.js sets base "./" so the build works under any subpath
        # (/vibecoding/claude-of-duty/) with no BASE_PATH env needed.
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build asphalt-outlaws
        working-directory: asphalt-outlaws
        # vite.config.ts sets base "./" so the build works under any subpath
        # (/vibecoding/asphalt-outlaws/) with no BASE_PATH env needed.
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build vulture-pass
        working-directory: vulture-pass
        # vite.config.js sets base "./" so the build works under any subpath
        # (/vibecoding/vulture-pass/) with no BASE_PATH env needed.
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build laser-snail
        working-directory: laser-snail
        # vite.config.ts sets base "./" so the build works under any subpath
        # (/vibecoding/laser-snail/) with no BASE_PATH env needed.
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build neon-rush
        working-directory: neon-rush
        # no bundler by design (neon-rush/ARCHITECTURE.md): ES modules + import
        # map + vendored three.js — `build` is a pure staging copy (dist = game),
        # already subpath-safe via relative paths.
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Stage site (preserve per-game URL prefixes)
        run: |
          mkdir -p site
          cp -r games-hub/. site/
          cp -r tank-racer/dist site/tank-racer
          cp -r undead-driver/dist site/undead-driver
          cp -r lugaru-combat/dist site/lugaru-combat
          cp -r dave-dangerous/dist site/dave-dangerous
          cp -r tiny-fighters/dist site/tiny-fighters
          cp -r Claude-of-Duty/dist site/claude-of-duty
          cp -r asphalt-outlaws/dist site/asphalt-outlaws
          cp -r vulture-pass/dist site/vulture-pass
          cp -r laser-snail/dist site/laser-snail
          cp -r neon-rush/dist site/neon-rush
          # devils-highway: NO build step — adopted no-build game (vanilla ES
          # modules + importmap, vendored three r172). Copy the public surface
          # verbatim, like games-hub; keep dev/QA folders out of the site.
          mkdir -p site/devils-highway
          cp devils-highway/index.html devils-highway/styles.css devils-highway/sw.js \
            devils-highway/manifest.webmanifest devils-highway/serve.mjs site/devils-highway/
          cp -r devils-highway/js devils-highway/vendor devils-highway/icons site/devils-highway/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
