# Games — GitHub Pages deploy
#
# Builds every web game in this monorepo and publishes them together to
# GitHub Pages. ONE workflow owns the whole site on purpose: each Pages
# deployment replaces the previous site, so separate per-game workflows
# would clobber each other's URLs.
#
  # Layout on Pages:
  #   /                   <- games-hub/ landing page (static, no build)
  #   /tank-racer/       <- tank-racer/dist      (built with BASE_PATH)
  #   /zombie-highway/   <- zombie-highway/dist  (vite base "./", subpath-safe)
  #   /lugaru-web/       <- lugaru-web/dist      (vite base "./", subpath-safe)
  #   /dave-dangerous/   <- dave-dangerous/dist  (vite base "./", subpath-safe)

name: Deploy Games to Pages

on:
  push:
    branches: [main]
    paths:
      - "tank-racer/**"
      - "zombie-highway/**"
      - "lugaru-web/**"
      - "dave-dangerous/**"
      - "games-hub/**"
      - ".github/workflows/games-pages-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Build tank-racer
        working-directory: tank-racer
        env:
          # Must match the path Pages serves the site under.
          BASE_PATH: /${{ github.event.repository.name }}/tank-racer/
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build zombie-highway
        working-directory: zombie-highway
        # vite.config.ts sets base "./" so the build works under any subpath
        # (/vibecoding/zombie-highway/) with no BASE_PATH env needed.
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Build lugaru-web
        working-directory: lugaru-web
        # vite.config.ts sets base "./" so the build works under any subpath
        # (/vibecoding/lugaru-web/) with no BASE_PATH env needed.
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build dave-dangerous
        working-directory: dave-dangerous
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage site (preserve per-game URL prefixes)
        run: |
          mkdir -p site
          cp -r games-hub/. site/
          cp -r tank-racer/dist site/tank-racer
          cp -r zombie-highway/dist site/zombie-highway
          cp -r lugaru-web/dist site/lugaru-web
          cp -r dave-dangerous/dist site/dave-dangerous

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
