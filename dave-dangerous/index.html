<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05080c" />
    <title>Dangerous Dave — Catacomb Depths</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2305080c'/%3E%3Crect x='4' y='2' width='8' height='5' fill='%23c93b2e'/%3E%3Crect x='4' y='7' width='8' height='7' fill='%233e6b4f'/%3E%3C/svg%3E" />
    <!-- Fonts: Cinzel (display — carved-stone titles) + Outfit (UI sans). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        /* Page-shell palette mirrors src/render3d/palette.ts (UI tokens). */
        --page-deep: #05080c;
        --page-text: #e8ecf2;
        --page-font-display: "Cinzel", Georgia, "Times New Roman", serif;
        --page-font-ui: "Outfit", "Sora", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: var(--page-deep);
        color: var(--page-text);
        min-height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        font-family: var(--page-font-ui);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      body {
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Game canvas fills the viewport; the DOM overlay mounts above it. */
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
