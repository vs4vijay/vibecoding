<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lugaru-web</title>
  <style>
    :root { color-scheme: dark; }
    html, body, #app {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: #eee;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }
    #game { display: block; width: 100%; height: 100%; }
    .hidden { display: none !important; }
    #error-screen {
      position: fixed;
      inset: 0;
      background: rgba(20, 0, 0, 0.92);
      z-index: 100;
      padding: 2rem;
      overflow: auto;
    }
    #error-screen h1 { margin-top: 0; }
    #error-detail {
      white-space: pre-wrap;
      background: #000;
      padding: 1rem;
      border-radius: 4px;
    }
    #error-retry {
      margin-top: 1rem;
      padding: 0.5rem 1.5rem;
      font-size: 1rem;
    }
    #coarse-warning {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 1.25rem;
      padding: 2rem;
    }
    #ui-root {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <div id="ui-root"></div>
    <div id="coarse-warning" class="hidden">This game needs a keyboard and mouse.</div>
    <div id="error-screen" class="hidden">
      <h1 id="error-title"></h1>
      <pre id="error-detail"></pre>
      <button id="error-retry" onclick="location.reload()">Retry</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
