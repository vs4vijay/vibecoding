<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Midtown Blitz — Open City Racing</title>
    <!-- Inline SVG favicon (amber summit on the dark UI color): prevents the
         automatic /favicon.ico request from logging a 404 console error in
         every session. No asset file, no network fetch. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2305070c'/%3E%3Cpath d='M3 12.5 L8 3.5 L13 12.5' fill='none' stroke='%23ffd452' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #05070c; }
      #app { width: 100%; height: 100%; }
      canvas { display: block; }
      #loading {
        position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
        align-items: center; justify-content: center; background: #05070c; color: #e8ecf4;
        font-family: 'Inter', system-ui, sans-serif; transition: opacity 0.6s ease;
      }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading h1 {
        font-family: 'Barlow Condensed', sans-serif; font-size: 64px; letter-spacing: 6px;
        background: linear-gradient(135deg, #ffd452 0%, #ff8a3d 100%);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      }
      #loading p { margin-top: 12px; color: #7a8299; font-size: 14px; letter-spacing: 2px; }
      #loading .bar { margin-top: 24px; width: 320px; height: 3px; background: #1a2030; border-radius: 2px; overflow: hidden; }
      #loading .bar div { height: 100%; width: 0%; background: linear-gradient(90deg, #ffd452, #ff8a3d); transition: width 0.3s ease; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">
      <h1>MIDTOWN BLITZ</h1>
      <p>LOADING OPEN CITY</p>
      <div class="bar"><div id="loadbar"></div></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
