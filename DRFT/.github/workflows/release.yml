name: release

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Release variant
        required: true
        type: choice
        default: focusRelease
        options: [focusRelease]
      signing:
        description: Signing mode
        required: true
        type: choice
        default: unsigned
        options: [unsigned]
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check.sh && bash scripts/test.sh

  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      VARIANT: focusRelease
      SIGNING_MODE: unsigned
      DRFT_GRADLE_CACHE_HOST: ${{ github.workspace }}/.cache/gradle
    steps:
      - uses: actions/checkout@v4
      - name: Validate release inputs
        run: |
          requested='${{ inputs.variant || 'focusRelease' }}'
          signing='${{ inputs.signing || 'unsigned' }}'
          [[ "$requested" == focusRelease ]] || { echo "Unsupported release variant: $requested" >&2; exit 1; }
          [[ "$signing" == unsigned ]] || { echo "Unsupported signing mode: $signing" >&2; exit 1; }
      - name: Load source identity
        id: cfg
        run: |
          source config/versions.env
          echo "firefox_repo=$FIREFOX_REPO" >> "$GITHUB_OUTPUT"
          echo "firefox_repo_key=${FIREFOX_REPO//\//-}" >> "$GITHUB_OUTPUT"
          echo "firefox_rev=$FIREFOX_REV" >> "$GITHUB_OUTPUT"
          echo "firefox_version=$FIREFOX_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            build/firefox-src
            build/state/source.env
          key: source-${{ steps.cfg.outputs.firefox_repo_key }}-${{ steps.cfg.outputs.firefox_rev }}
      - uses: actions/cache@v4
        with:
          path: .cache/gradle
          key: gradle-${{ runner.os }}-${{ steps.cfg.outputs.firefox_rev }}-${{ hashFiles('config/versions.env', 'Dockerfile') }}
          restore-keys: gradle-${{ runner.os }}-${{ steps.cfg.outputs.firefox_rev }}-
      - run: bash scripts/docker.sh build-image
      - run: bash scripts/docker.sh all "$VARIANT"
      - run: bash scripts/docker.sh shell scripts/verify-artifacts.sh
      - name: Verify unsigned release status
        run: bash scripts/docker.sh shell scripts/verify-signing.sh --expect-unsigned
      - name: Record checksums
        run: |
          echo 'signing_status=UNSIGNED' >> dist/build-manifest.txt
          (cd dist && sha256sum -- *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: drft-focusRelease-${{ steps.cfg.outputs.firefox_version }}-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          name: ${{ github.ref_name }}
          body: |
            UNSIGNED DRFT release candidate; do not distribute before signing and device smoke testing.

            Source: `${{ steps.cfg.outputs.firefox_repo }}`
            Revision: `${{ steps.cfg.outputs.firefox_rev }}`
            Firefox: `${{ steps.cfg.outputs.firefox_version }}`
            Variant: `focusRelease`
          files: |
            dist/**/*.apk
            dist/build-manifest.txt
            dist/signing-status.txt
            dist/SHA256SUMS
