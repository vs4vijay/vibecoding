name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lightweight validation
        run: bash scripts/check.sh && bash scripts/test.sh

  build-debug:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Load cache identity
        id: cfg
        run: |
          source config/versions.env
          echo "firefox_rev=$FIREFOX_REV" >> "$GITHUB_OUTPUT"
          echo "firefox_repo=${FIREFOX_REPO//\//-}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: source-cache
        with:
          path: |
            build/firefox-src
            build/state/source.env
          key: source-${{ steps.cfg.outputs.firefox_repo }}-${{ steps.cfg.outputs.firefox_rev }}
      - uses: actions/cache@v4
        id: gradle-cache
        with:
          path: .cache/gradle
          key: gradle-${{ runner.os }}-${{ steps.cfg.outputs.firefox_rev }}-${{ hashFiles('config/versions.env', 'Dockerfile') }}
          restore-keys: gradle-${{ runner.os }}-${{ steps.cfg.outputs.firefox_rev }}-
      - name: Cache diagnostics
        run: |
          echo "source cache hit: ${{ steps.source-cache.outputs.cache-hit }}"
          echo "gradle cache hit: ${{ steps.gradle-cache.outputs.cache-hit }}"
      - name: Build pinned image
        run: bash scripts/docker.sh build-image
      - name: Build focusDebug through local path
        env:
          DRFT_GRADLE_CACHE_HOST: ${{ github.workspace }}/.cache/gradle
        run: bash scripts/docker.sh all focusDebug
      - name: Verify staged artifacts
        env:
          DRFT_GRADLE_CACHE_HOST: ${{ github.workspace }}/.cache/gradle
        run: bash scripts/docker.sh shell scripts/verify-artifacts.sh
      - uses: actions/upload-artifact@v4
        with:
          name: drft-focusDebug-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
